<!--
logs.html

This page displays the history of authentication checks.

What it does:
1. Reads logs sent from app.py.
2. Shows every device behavior check.
3. Displays time, device name, type, status, risk level, and action.
4. Allows the user to return to the dashboard.
-->

<!DOCTYPE html>
<html>
<head>
    <title>Authentication Logs</title>

    <!-- Link CSS design file -->
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="container">

    <!-- Page title -->
    <h1>Authentication Logs</h1>

    <!-- Page subtitle -->
    <p class="subtitle">
        History of device behavior checks
    </p>

    <!-- Logs table -->
    <table>

        <!-- Table headers -->
        <tr>
            <th>Time</th>
            <th>Device Name</th>
            <th>Device Type</th>
            <th>Status</th>
            <th>Risk Level</th>
            <th>Action</th>
        </tr>

        <!-- Loop through all saved logs -->
        {% for log in logs %}
        <tr>
            <td>{{ log.time }}</td>
            <td>{{ log.device_name }}</td>
            <td>{{ log.device_type }}</td>
            <td>{{ log.status }}</td>
            <td>{{ log.risk_level }}</td>
            <td>{{ log.action }}</td>
        </tr>
        {% endfor %}

    </table>

    <br>

    <!-- Back button -->
    <a href="/">
        <button class="blue">
            Back to Dashboard
        </button>
    </a>

</div>

</body>
</html>
