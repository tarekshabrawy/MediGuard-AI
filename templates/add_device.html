<!DOCTYPE html>
<html>
<head>
    <title>Add Sensor - MediGuard AI</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="form-page">
    <div class="form-card">
        <div class="form-badge">+</div>
        <h1>Add New Sensor</h1>
        <p>Register a medical storage device for AI monitoring.</p>

        <form method="POST">
            <label>Device Name</label>
            <input type="text" name="device_name" placeholder="Vaccine Refrigerator Unit 1" required>

            <label>Device Type</label>
            <select name="device_type" required>
                <option value="">Select device type</option>
                <option value="temperature_sensor">Temperature Sensor</option>
                <option value="humidity_sensor">Humidity Sensor</option>
                <option value="cold_room_sensor">Cold Room Sensor</option>
                <option value="storage_monitor">Storage Monitor</option>
            </select>

            <label>Location</label>
            <input type="text" name="location" placeholder="Pharmacy Room 1" required>

            <label>Storage Type</label>
            <select name="storage_type" required>
                <option value="">Select storage type</option>
                <option value="Vaccines">Vaccines</option>
                <option value="Medicines">Medicines</option>
                <option value="Biological Samples">Biological Samples</option>
                <option value="Chemicals">Chemicals</option>
                <option value="General Storage">General Storage</option>
            </select>

            <div class="form-actions">
                <button class="btn-primary" type="submit">Register Sensor</button>
                <a class="btn-secondary" href="/dashboard">Cancel</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
