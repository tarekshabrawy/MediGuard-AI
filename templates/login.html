<!DOCTYPE html>
<html>
<head>
    <title>Login - MediGuard AI</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="welcome-body">

<div class="presentation-bg">
    <div class="bg-grid"></div>
    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>
    <div class="glow glow-three"></div>
</div>

<div class="welcome-shell">

    <div class="login-card presentation-enter">

        <div class="login-header">
            <div class="form-badge animated-lock">🔐</div>
            <span class="system-label">Secure Access Portal</span>
            <h1>System Login</h1>
            <p>Choose your role and access the monitoring environment.</p>
        </div>

        {% if error %}
            <div class="error-box animated-error">{{ error }}</div>
        {% endif %}

        <form method="POST" class="login-form">

            <label>Username</label>
            <div class="input-wrap">
                <span>👤</span>
                <input type="text" name="username" required>
            </div>

            <label>Password</label>
            <div class="input-wrap">
                <span>🔑</span>
                <input type="password" name="password" required>
            </div>

            <div class="form-actions">
                <button class="btn-primary premium-login-btn" type="submit">
                    Login
                </button>

                <a class="btn-secondary" href="/">
                    Back
                </a>
            </div>
        </form>

        

    </div>

</div>

</body>
</html>
